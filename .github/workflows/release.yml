name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/AramTrackerCompanion -p:PublishProfile=win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ARAMTrackerCompanion.exe
          generate_release_notes: true
